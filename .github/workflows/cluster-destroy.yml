name: Destroy EKS Cluster

on:
  workflow_dispatch:
    inputs:
      AWS_REGION:
        description: 'AWS region (ex: us-east-1)'
        type: string
        required: true
        default: 'us-east-1'
      CLUSTER_NAME:
        description: 'EKS cluster name'
        type: string
        required: true
        default: 'agro-tech'
      confirm_destroy:
        description: 'Type "DESTROY" to confirm cluster deletion'
        required: true
        type: string

env:
  # Centraliza credenciais e inputs para o workflow
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ inputs.AWS_REGION }}
  CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}


jobs:
  # Job 1: valida confirmacao e inputs obrigatorios
  validate-input:
    name: Validate Destruction Confirmation
    runs-on: ubuntu-latest
    
    steps:
      # Validação de segurança: exige que o usuário digite "DESTROY" exatamente
      # Previne deleções acidentais do cluster inteiro
      - name: Check Confirmation
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Confirmation failed. You must type 'DESTROY' to proceed."
            exit 1
          fi
          echo "Confirmation validated"

      - name: Validate inputs
        run: |
          missing=false
          for var in AWS_REGION CLUSTER_NAME; do
            value=$(printenv "$var")
            if [ -z "$value" ]; then
              echo "Missing required input: $var"
              missing=true
            fi
          done
          if [ "$missing" = "true" ]; then
            exit 1
          fi
  
  # Job 2: remove releases, add-ons e o cluster EKS
  destroy-cluster:
    name: Delete EKS Cluster and Resources
    runs-on: ubuntu-latest
    needs: [validate-input]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install eksctl
        run: |
          curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
          tar -xzf eksctl_Linux_amd64.tar.gz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version
      
      - name: Install Helm
        run: |
          # Helm e usado para remover releases antes do delete do cluster
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update kubeconfig
        run: |
          # Necessario para helm/kubectl apontarem para o cluster certo
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      
      # Remove todas as aplicações instaladas via Helm antes de deletar o cluster
      # Isso permite que recursos da AWS (ALBs, etc) sejam limpos adequadamente
      - name: Remove Helm Releases (apps first)
        run: |
          echo "Removing Helm releases (apps first)..."
          echo "Keeping aws-load-balancer-controller until ELBv2 cleanup completes."

          helm list -A -o json | jq -r '.[] | [.name, .namespace] | @tsv' | while IFS=$'\t' read -r name ns; do
            if [ -z "$name" ] || [ -z "$ns" ]; then
              continue
            fi

            if [ "$name" = "aws-load-balancer-controller" ] && [ "$ns" = "kube-system" ]; then
              echo "Skipping (delete last): $name -n $ns"
              continue
            fi

            echo "Deleting: $name -n $ns"
            timeout 120s helm uninstall "$name" -n "$ns" --no-hooks || true
          done

          echo "Helm releases removed (apps first)"
        continue-on-error: true
      
      # Remove o add-on do CloudWatch Application Signals antes de deletar o cluster
      # Isso garante que os recursos do CloudWatch sejam limpos corretamente
      - name: Delete CloudWatch Application Signals Add-on
        run: |
          echo "Removing CloudWatch Application Signals add-on..."
          aws eks delete-addon \
            --cluster-name ${{ env.CLUSTER_NAME }} \
            --addon-name amazon-cloudwatch-observability \
            --region ${{ env.AWS_REGION }} || true
          
          echo "Waiting for add-on deletion..."
          sleep 30
          
          echo "CloudWatch add-on removed"
        continue-on-error: true
      
      # Cleanup de ELBv2 por tag (nao por nome)
      # Motivo: nomes k8s-* nao sao confiaveis e podem nao conter o CLUSTER_NAME (ex: k8s-agrotech-...)
      - name: Cleanup ELBv2 Resources (tagged to cluster)
        run: |
          REGION="${{ env.AWS_REGION }}"
          CLUSTER="${{ env.CLUSTER_NAME }}"

          echo "Waiting for AWS Load Balancer Controller to process Ingress deletions..."
          sleep 60

          echo "Cleaning up ELBv2 resources tagged with elbv2.k8s.aws/cluster=${CLUSTER}..."

          LB_ARNS=$(aws resourcegroupstaggingapi get-resources \
            --region "$REGION" \
            --tag-filters Key=elbv2.k8s.aws/cluster,Values="$CLUSTER" \
            --resource-type-filters elasticloadbalancing:loadbalancer \
            --query 'ResourceTagMappingList[].ResourceARN' \
            --output text 2>/dev/null || true)

          if [ -n "$LB_ARNS" ]; then
            echo "Deleting load balancers..."
            for arn in $LB_ARNS; do
              echo "Deleting LB: $arn"
              aws elbv2 delete-load-balancer --region "$REGION" --load-balancer-arn "$arn" || true
            done

            echo "Waiting for load balancers to be deleted..."
            aws elbv2 wait load-balancers-deleted --region "$REGION" --load-balancer-arns $LB_ARNS || true
          else
            echo "No tagged load balancers found."
          fi

          echo "Sleeping 20s for propagation..."
          sleep 20

          TG_ARNS=$(aws resourcegroupstaggingapi get-resources \
            --region "$REGION" \
            --tag-filters Key=elbv2.k8s.aws/cluster,Values="$CLUSTER" \
            --resource-type-filters elasticloadbalancing:targetgroup \
            --query 'ResourceTagMappingList[].ResourceARN' \
            --output text 2>/dev/null || true)

          if [ -n "$TG_ARNS" ]; then
            echo "Deleting target groups..."
            for arn in $TG_ARNS; do
              echo "Deleting TG: $arn"
              aws elbv2 delete-target-group --region "$REGION" --target-group-arn "$arn" || true
            done
          else
            echo "No tagged target groups found."
          fi

          echo "ELBv2 cleanup complete"
        continue-on-error: true

      - name: Remove AWS Load Balancer Controller (last)
        run: |
          echo "Removing aws-load-balancer-controller (last)..."

          if helm status aws-load-balancer-controller -n kube-system >/dev/null 2>&1; then
            helm uninstall aws-load-balancer-controller -n kube-system --wait --timeout 10m || true
            echo "aws-load-balancer-controller removed"
          else
            echo "aws-load-balancer-controller release not found, skipping"
          fi
        continue-on-error: true

      - name: Delete EKS Nodegroups
        run: |
          echo "Checking if cluster exists..."
          if eksctl get cluster --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }} &>/dev/null; then
            echo "Cluster exists. Listing nodegroups..."
            
            NODEGROUPS=$(eksctl get nodegroup --cluster ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }} -o json | jq -r '.[].Name')
            
            if [ -z "$NODEGROUPS" ]; then
              echo "No nodegroups found for cluster ${{ env.CLUSTER_NAME }}."
            else
              for NG in $NODEGROUPS; do
                echo "Deleting nodegroup: $NG (--drain=false)"

                set +e
                eksctl delete nodegroup --cluster ${{ env.CLUSTER_NAME }} --name "$NG" --region ${{ env.AWS_REGION }} --wait --drain=false
                RC=$?
                set -e

                if [ $RC -ne 0 ]; then
                  echo "eksctl delete nodegroup failed. Falling back to AWS API delete-nodegroup..."
                  aws eks delete-nodegroup --cluster-name ${{ env.CLUSTER_NAME }} --nodegroup-name "$NG" --region ${{ env.AWS_REGION }} || true
                  aws eks wait nodegroup-deleted --cluster-name ${{ env.CLUSTER_NAME }} --nodegroup-name "$NG" --region ${{ env.AWS_REGION }} || true
                fi
              done
              echo "All nodegroups deleted successfully."
            fi
          else
            echo "Cluster ${{ env.CLUSTER_NAME }} does not exist. Nothing to delete."
          fi        

      # Deleta o cluster EKS completamente
      # Isso inclui: control plane, node groups, OIDC provider e IRSA roles
      # --wait garante que o comando só retorna após a deleção completa
      - name: Delete EKS Cluster
        run: |
          # Remove control plane, node groups e OIDC provider
          echo "Deleting EKS cluster..."
          eksctl delete cluster --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }} --wait
          echo "Cluster deleted"
      
      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "CLUSTER DESTRUCTION COMPLETE"
          echo "========================================"
          echo ""
          echo "NOT DELETED (manual cleanup if needed):"
          echo "   - IAM Policies (AWSLoadBalancerControllerIAMPolicy, AgroTechExternalSecretsPolicy, CloudWatchApplicationSignalsPolicy)"
          echo "   - AWS Secrets Manager secrets (prefix definido por voce)"
          echo "   - VPC and networking"
          echo "   - ECR repositories"
          echo "   - CloudWatch Log Groups (/aws/application-signals/*, /aws/containerinsights/${CLUSTER_NAME}/*)"
          echo ""

name: Destroy EKS Cluster

on:
  workflow_dispatch:
    inputs:
      AWS_REGION:
        description: 'AWS region (ex: us-east-1)'
        type: string
        required: true
        default: 'us-east-1'
      CLUSTER_NAME:
        description: 'EKS cluster name'
        type: string
        required: true
        default: 'agro-tech'
      confirm_destroy:
        description: 'Type "DESTROY" to confirm cluster deletion'
        required: true
        type: string

env:
  # Centraliza credenciais e inputs para o workflow
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: ${{ inputs.AWS_REGION }}
  CLUSTER_NAME: ${{ inputs.CLUSTER_NAME }}


jobs:
  # Job 1: valida confirmacao e inputs obrigatorios
  validate-input:
    name: Validate Destruction Confirmation
    runs-on: ubuntu-latest
    
    steps:
      # Validação de segurança: exige que o usuário digite "DESTROY" exatamente
      # Previne deleções acidentais do cluster inteiro
      - name: Check Confirmation
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "Confirmation failed. You must type 'DESTROY' to proceed."
            exit 1
          fi
          echo "Confirmation validated"

      - name: Validate inputs
        run: |
          missing=false
          for var in AWS_REGION CLUSTER_NAME; do
            value=$(printenv "$var")
            if [ -z "$value" ]; then
              echo "Missing required input: $var"
              missing=true
            fi
          done
          if [ "$missing" = "true" ]; then
            exit 1
          fi
  
  # Job 2: remove releases, add-ons e o cluster EKS
  destroy-cluster:
    name: Delete EKS Cluster and Resources
    runs-on: ubuntu-latest
    needs: [validate-input]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Install eksctl
        run: |
          curl -sLO "https://github.com/eksctl-io/eksctl/releases/latest/download/eksctl_Linux_amd64.tar.gz"
          tar -xzf eksctl_Linux_amd64.tar.gz -C /tmp
          sudo mv /tmp/eksctl /usr/local/bin
          eksctl version
      
      - name: Install Helm
        run: |
          # Helm e usado para remover releases antes do delete do cluster
          curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Update kubeconfig
        run: |
          # Necessario para helm/kubectl apontarem para o cluster certo
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      
      # Remove todas as aplicações instaladas via Helm antes de deletar o cluster
      # Isso permite que recursos da AWS (ALBs, etc) sejam limpos adequadamente
      - name: Remove Helm Releases
        run: |
          echo "Removing Helm releases..."
          helm list -A -o json | jq -r '.[] | "\(.name) -n \(.namespace)"' | while read release; do
            echo "Deleting: $release"
            helm uninstall $release --wait || true
          done
          echo "Helm releases removed"
        continue-on-error: true
      
      # Remove o add-on do CloudWatch Application Signals antes de deletar o cluster
      # Isso garante que os recursos do CloudWatch sejam limpos corretamente
      - name: Delete CloudWatch Application Signals Add-on
        run: |
          echo "Removing CloudWatch Application Signals add-on..."
          aws eks delete-addon \
            --cluster-name ${{ env.CLUSTER_NAME }} \
            --addon-name amazon-cloudwatch-observability \
            --region ${{ env.AWS_REGION }} || true
          
          echo "Waiting for add-on deletion..."
          sleep 30
          
          echo "CloudWatch add-on removed"
        continue-on-error: true
      
      # Força a deleção de ALBs que podem ter sido criados pelas aplicações
      # O sleep de 60s dá tempo para o controller processar a remoção dos Ingress
      - name: Delete Load Balancers
        run: |
          echo "Waiting for ALBs to be deleted..."
          sleep 60
          
          # Busca e deleta ALBs criados pelo cluster (começam com k8s-<cluster>)
          aws elbv2 describe-load-balancers --region ${{ env.AWS_REGION }} --query "LoadBalancers[?contains(LoadBalancerName, 'k8s-${{ env.CLUSTER_NAME }}')].LoadBalancerArn" --output text | while read lb_arn; do
            if [ ! -z "$lb_arn" ]; then
              echo "Force deleting: $lb_arn"
              aws elbv2 delete-load-balancer --load-balancer-arn $lb_arn --region ${{ env.AWS_REGION }} || true
            fi
          done
          
          echo "Load balancers cleaned up"
        continue-on-error: true
      
      # Target Groups são os grupos de destino do ALB (pods do Kubernetes)
      # Devem ser deletados antes do cluster para evitar recursos órfãos
      - name: Delete Target Groups
        run: |
          echo "Cleaning up target groups..."
          aws elbv2 describe-target-groups --region ${{ env.AWS_REGION }} --query "TargetGroups[?contains(TargetGroupName, 'k8s-${{ env.CLUSTER_NAME }}')].TargetGroupArn" --output text | while read tg_arn; do
            if [ ! -z "$tg_arn" ]; then
              echo "Deleting: $tg_arn"
              aws elbv2 delete-target-group --target-group-arn $tg_arn --region ${{ env.AWS_REGION }} || true
            fi
          done
          echo "Target groups cleaned up"
        continue-on-error: true

      - name: Delete EKS Nodegroups
        run: |
          echo "Checking if cluster exists..."
          if eksctl get cluster --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }} &>/dev/null; then
            echo "Cluster exists. Listing nodegroups..."
            
            NODEGROUPS=$(eksctl get nodegroup --cluster ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }} -o json | jq -r '.[].Name')
            
            if [ -z "$NODEGROUPS" ]; then
              echo "No nodegroups found for cluster ${{ env.CLUSTER_NAME }}."
            else
              for NG in $NODEGROUPS; do
                echo "Deleting nodegroup: $NG"
                eksctl delete nodegroup --cluster ${{ env.CLUSTER_NAME }} --name "$NG" --region ${{ env.AWS_REGION }} --wait
              done
              echo "All nodegroups deleted successfully."
            fi
          else
            echo "Cluster $EKS_CLUSTER does not exist. Nothing to delete."
          fi        

      # Deleta o cluster EKS completamente
      # Isso inclui: control plane, node groups, OIDC provider e IRSA roles
      # --wait garante que o comando só retorna após a deleção completa
      - name: Delete EKS Cluster
        run: |
          # Remove control plane, node groups e OIDC provider
          echo "Deleting EKS cluster..."
          eksctl delete cluster --name ${{ env.CLUSTER_NAME }} --region ${{ env.AWS_REGION }} --wait
          echo "Cluster deleted"
      
      - name: Summary
        run: |
          echo ""
          echo "========================================"
          echo "CLUSTER DESTRUCTION COMPLETE"
          echo "========================================"
          echo ""
          echo "NOT DELETED (manual cleanup if needed):"
          echo "   - IAM Policies (AWSLoadBalancerControllerIAMPolicy, AgroTechExternalSecretsPolicy, CloudWatchApplicationSignalsPolicy)"
          echo "   - AWS Secrets Manager secrets (prefix definido por voce)"
          echo "   - VPC and networking"
          echo "   - ECR repositories"
          echo "   - CloudWatch Log Groups (/aws/application-signals/*, /aws/containerinsights/${CLUSTER_NAME}/*)"
          echo ""
